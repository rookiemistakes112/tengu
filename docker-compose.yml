services:

  # ── Tengu MCP Server ─────────────────────────────────────────────────────────
  tengu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TENGU_TIER: ${TENGU_TIER:-core}
    image: tengu:${TENGU_TIER:-core}
    ports:
      - "${TENGU_PORT:-8000}:8000"
    cap_add:
      - NET_RAW    # required for nmap SYN scan and masscan raw sockets
      - NET_ADMIN  # required for masscan
    # NOTE: no-new-privileges intentionally omitted — combined with cap_add it
    # triggers a runc bug where the container's init process fails to exec
    # anything at all ("exec ...: operation not permitted"), confirmed via
    # `docker run --cap-add=NET_ADMIN --cap-add=NET_RAW --security-opt
    # no-new-privileges alpine echo hi` failing the same way on this host.
    volumes:
      - tengu-output:/app/output
      - tengu-logs:/app/logs
    env_file:
      - path: .env
        required: false
    environment:
      - TENGU_CONFIG_PATH=/app/tengu.toml
      - TENGU_ALLOWED_HOSTS=${TENGU_ALLOWED_HOSTS:-}
      - TENGU_LOG_LEVEL=${TENGU_LOG_LEVEL:-INFO}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - TENGU_SHODAN_API_KEY=${TENGU_SHODAN_API_KEY:-}
      - ZAP_BASE_URL=http://tengu-zap:8080
      - ZAP_API_KEY=${ZAP_API_KEY:-tengu-zap-key}
      - MSF_RPC_HOST=tengu-msf
      - MSF_RPC_PORT=55553
      - MSF_RPC_PASSWORD=${MSF_RPC_PASSWORD:-tengu}
    restart: unless-stopped
    networks:
      tengu-net:
        aliases:
          - tengu

  # ── Metasploit RPC (profile: exploit) ────────────────────────────────────────
  tengu-msf:
    image: metasploitframework/metasploit-framework:latest
    profiles:
      - exploit
    environment:
      - MSF_RPC_PASSWORD=${MSF_RPC_PASSWORD:-tengu}
    command: bash -c "/usr/src/metasploit-framework/msfrpcd -P $$MSF_RPC_PASSWORD -S -f -a 0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/55553"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      tengu-net:
        aliases:
          - tengu-msf

  # ── OWASP ZAP (profile: proxy) ───────────────────────────────────────────────
  tengu-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles:
      - proxy
    command: zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-tengu-zap-key}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      tengu-net:
        aliases:
          - tengu-zap

  # ── Lab Targets (profile: lab) ───────────────────────────────────────────────
  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles:
      - lab
    restart: unless-stopped
    networks:
      tengu-net:
        aliases:
          - juice-shop
          - juice-shop.local

  dvwa:
    image: vulnerables/web-dvwa:latest
    profiles:
      - lab
    restart: unless-stopped
    networks:
      tengu-net:
        aliases:
          - dvwa
          - dvwa.local

  # OWASP Mutillidae II (Task 3.3.1, Epic 3). Two containers, not one: unlike
  # dvwa/juice-shop above, the official webpwnized/mutillidae image ships its
  # web app and MySQL backend as separate images with no "latest" tag — pin
  # exact tags (verified on Docker Hub before wiring this in). LDAP-backed
  # challenges (a small subset) are intentionally NOT included here — that
  # would mean a 3rd container (webpwnized/mutillidae:ldap) plus 2 volumes;
  # skipped to keep this lab target's footprint in line with dvwa/juice-shop's
  # single/near-single-container simplicity. The core app still starts and
  # serves fine without it — the www image's ldap-config.inc just points at
  # an unreachable "directory" host, which only breaks the LDAP-specific pages.
  # Host port mapping (for a human to open it in a browser) lives in
  # docker-compose.override.yml, same as dvwa/juice-shop's — not here.
  mutillidae-db:
    image: webpwnized/mutillidae:database
    profiles:
      - lab
    restart: unless-stopped
    networks:
      tengu-net:
        # "database" (not "mutillidae-db") is REQUIRED: the www image below
        # has DB_HOST hardcoded to this exact hostname at build time (see
        # webpwnized/mutillidae-docker .build/www/Dockerfile) — there is no
        # environment variable to override it post-build. If another lab
        # target ever needs a "database" alias on this network, they collide;
        # none currently does.
        aliases:
          - database

  mutillidae:
    image: webpwnized/mutillidae:www
    profiles:
      - lab
    restart: unless-stopped
    depends_on:
      - mutillidae-db
    networks:
      tengu-net:
        aliases:
          - mutillidae
          - mutillidae.local

  # ── Tengu Autonomous Agent (profile: agent) ──────────────────────────────────
  tengu-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TENGU_TIER: ${TENGU_TIER:-core}
    image: tengu:${TENGU_TIER:-core}
    profiles:
      - agent
    depends_on:
      tengu:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/entrypoint-agent.sh"]
    volumes:
      - tengu-output:/app/output
      - tengu-logs:/app/logs
    env_file:
      - path: .env
        required: true    # .env must exist — needs ANTHROPIC_API_KEY
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TENGU_AGENT_TARGET=${TENGU_AGENT_TARGET:-}
      - TENGU_AGENT_SCOPE=${TENGU_AGENT_SCOPE:-}
      - TENGU_AGENT_TYPE=${TENGU_AGENT_TYPE:-blackbox}
      - TENGU_AGENT_MAX_ITER=${TENGU_AGENT_MAX_ITER:-50}
      - TENGU_AGENT_MODEL=${TENGU_AGENT_MODEL:-claude-sonnet-4-6}
      - TENGU_AGENT_MAX_TOKENS=${TENGU_AGENT_MAX_TOKENS:-2048}
      - TENGU_AGENT_TIMEOUT=${TENGU_AGENT_TIMEOUT:-60}
      - TENGU_ALLOWED_HOSTS=${TENGU_ALLOWED_HOSTS:-}
      - TENGU_LOG_LEVEL=${TENGU_LOG_LEVEL:-INFO}
      - TENGU_CONFIG_PATH=/app/tengu.toml
      - TENGU_AGENT_AUTO_APPROVE=${TENGU_AGENT_AUTO_APPROVE:-false}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # NOTE: no-new-privileges intentionally omitted — see tengu service above.
    stdin_open: true    # Required for human-in-the-loop approval prompts
    tty: true           # Required for human-in-the-loop approval prompts
    networks:
      tengu-net:
        aliases:
          - tengu-agent

networks:
  tengu-net:
    name: tengu-net
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  tengu-output:
    name: tengu-output
  tengu-logs:
    name: tengu-logs
